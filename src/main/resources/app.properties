# Link time-to-live (ISO-8601 duration, e.g. PT24H, PT1H, PT30S)
link.ttl=PT24H

# Allowed range for the click limit set by the user
link.min-limit=1
link.max-limit=1000

# Short code length and prefix shown to the user
link.code-length=6
link.prefix=clck.ru/

# How often expired links are removed
cleanup.interval=PT1M

# Where data is stored
storage.file=data/links.json
